spec_version: "0.1.0"
name: streaming-hyperloglog-counter
version: 1.0.0
description: Maintains low-memory HyperLogLog++ sketches across high-throughput distributed clickstreams to compute distinct visitor cardinalities with sub-1% error.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - hll-cardinality-estimation
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - data-analytics
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/streaming-hyperloglog-counter"
